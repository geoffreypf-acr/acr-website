<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM — ACR Automobile (Private)</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<style>
  body { margin: 0; }
  .crm-shell { padding: 20px 22px 60px; max-width: 1600px; margin: 0 auto; }
  .crm-head { display: flex; align-items: center; gap: 16px; padding: 14px 0 18px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px; flex-wrap: wrap; }
  .crm-head img { height: 24px; }
  .crm-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .02em; margin: 0; }
  .crm-head .spacer { flex: 1; }
  .crm-search { height: 42px; padding: 0 14px; min-width: 220px; background: var(--surface-inset); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); font-family: var(--font-body); font-size: 14.5px; }
  .crm-search:focus { outline: none; border-color: var(--signal-500); box-shadow: 0 0 0 3px var(--accent-soft); }
  .crm-btn { height: 42px; padding: 0 16px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); font-family: var(--font-body); font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .crm-btn:hover { border-color: var(--signal-500); background: var(--accent-soft); }
  .crm-btn.primary { background: var(--silver-fill); color: var(--silver-ink); border-color: transparent; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px; border-radius: 999px; background: var(--alert-soft); border: 1px solid rgba(224,105,91,.3); color: var(--alert-400); font-size: 13px; font-weight: 600; }
  .pill.zero { background: var(--surface-inset); border-color: var(--border-default); color: var(--text-muted); }

  /* ---- Dashboard ---- */
    .dash { margin-bottom: 20px; }
    .dash-opt { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12.5px;
      color: var(--text-muted); cursor: pointer; user-select: none; }
    .dash-opt input { width: 15px; height: 15px; accent-color: var(--signal-500); cursor: pointer; }
    .dash-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
    .tile { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 15px 16px; }
    .tile .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .tile .v { font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--text-primary); line-height: 1.15; margin-top: 7px; letter-spacing: -.01em; }
    .tile .s { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .dash-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; margin-top: 12px; align-items: start; }
    .dcard { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 15px 16px 17px; }
    .dcard h3 { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-secondary); margin: 0 0 13px; }
    .dcard-h { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
    .dcard-h h3 { margin: 0; flex: 1; }
    .dsel { flex: none; height: 28px; padding: 0 8px; border-radius: var(--radius-md); border: 1px solid var(--border-default);
      background: var(--surface-inset); color: var(--text-secondary); font-family: var(--font-body); font-size: 12px; cursor: pointer; }
    .dsel:focus { outline: none; border-color: var(--signal-500); }
    .dcard .empty { font-size: 12.5px; color: var(--text-muted); }
    .bw .r { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
    .bw .r:last-child { border-bottom: 0; }
    .bw .k { flex: 1; font-size: 12.5px; color: var(--text-muted); }
    .bw .w { font-size: 13px; color: var(--text-secondary); }
    .bw .v { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
    .bw .v.low { color: var(--text-secondary); }
    /* horizontal magnitude bars - one hue, direct labels, 4px rounded data-end */
    .bars .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 9px; }
    .bars .lab { font-size: 12.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bars .num { font-size: 12.5px; color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
    .bars .track { grid-column: 1 / -1; height: 8px; background: rgba(180,196,210,.07); border-radius: 4px; overflow: hidden; }
    .bars .fill { height: 100%; background: #2FA1CC; border-radius: 4px; min-width: 3px; }
    /* weekly columns - single series */
    .cols { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
    .cols.many { gap: 3px; }
    .cols.many .wl { font-size: 9.5px; }
    .cols .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
    .cols .bar { width: 100%; background: #2FA1CC; border-radius: 4px 4px 0 0; min-height: 2px; }
    .cols .bar.zero { background: rgba(180,196,210,.16); }
    .cols .wl { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }
    .cols .cv { font-size: 11px; color: var(--text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) { .dash-charts { grid-template-columns: 1fr; } }
    .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(258px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: start; }
  .col { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-height: 120px; }
  .col.drop { border-color: var(--signal-500); box-shadow: 0 0 0 1px var(--signal-500); }
  .col-h { display: flex; align-items: center; gap: 9px; padding: 14px 15px 10px; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .col-h .nm { font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: .02em; }
  .col-h .ct { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .col-h .sum { font-family: var(--font-mono); font-size: 11px; color: var(--signal-300); }
  .col-body { padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 9px; min-height: 40px; }

  .card { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 12px 13px; cursor: pointer; transition: border-color .15s, transform .05s; }
  .card:hover { border-color: var(--border-strong); }
  .card:active { transform: scale(.99); }
  .card.overdue { border-left: 3px solid var(--alert-400); }
  .card .nm { font-weight: 600; font-size: 14px; color: var(--text-primary); }
  .card .meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }
  .card .row2 { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .card .card-act { margin-top: 9px; }
  .card .card-act .book { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border-default); background: var(--surface-inset); color: var(--text-secondary);
    font-family: var(--font-body); font-size: 11.5px; font-weight: 600; text-decoration: none; }
  .card .card-act .book:hover { border-color: var(--signal-500); color: var(--text-primary); background: var(--accent-soft); }
  .chip { font-family: var(--font-mono); font-size: 10.5px; padding: 3px 7px; border-radius: 6px; background: var(--surface-inset); color: var(--text-muted); border: 1px solid var(--border-subtle); }
  .chip.val { color: var(--signal-300); border-color: rgba(47,161,204,.3); }
  .chip.fu { color: var(--warn-400); border-color: rgba(223,174,78,.3); }
  .chip.fu.late { color: var(--alert-400); border-color: rgba(224,105,91,.35); background: var(--alert-soft); }
  .empty-col { color: var(--text-muted); font-size: 12px; font-style: italic; padding: 10px 4px; text-align: center; }

  /* Drawer */
  .drawer-bg { position: fixed; inset: 0; background: rgba(6,15,22,.55); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer-bg.open { opacity: 1; pointer-events: auto; }
  .drawer { box-sizing: border-box; position: fixed; top: 0; right: 0; height: 100%; width: 440px; max-width: 100vw; overflow-x: hidden; background: var(--surface-1); border-left: 1px solid var(--border-default); z-index: 81; transform: translateX(100%); transition: transform .22s var(--ease-out, ease); display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer-h { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 16px; border-bottom: 1px solid var(--border-subtle); }
  .drawer-h .nm { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .02em; }
  .drawer-h .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .drawer-h .x { margin-left: auto; background: transparent; border: none; color: var(--text-muted); font-size: 24px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 7px; }
  .drawer-h .x:hover { color: var(--text-primary); background: var(--surface-inset); }
  .drawer-body { padding: 18px 20px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 15px; }
  .dfield { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .dfield label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .dfield input, .dfield select, .dfield textarea { box-sizing: border-box; height: 46px; padding: 0 13px; background: var(--surface-inset); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); font-family: var(--font-body); font-size: 15px; width: 100%; }
  .dfield textarea { height: auto; min-height: 90px; padding: 11px 13px; line-height: 1.5; resize: vertical; }
  .fu-quick { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 2px; }
  .fu-quick button { flex: 1; min-width: 68px; height: 36px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--surface-inset); color: var(--text-secondary); font-family: var(--font-body); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .fu-quick button:hover { border-color: var(--signal-500); color: var(--text-primary); background: var(--accent-soft); }
  .fu-quick button.clr { flex: none; min-width: 0; padding: 0 12px; color: var(--text-muted); }
  .fu-quick button.clr:hover { color: var(--alert-400); border-color: rgba(224,105,91,.35); background: var(--alert-soft); }
  /* Follow-up attempt colours: 1 green · 2 yellow · 3 red */
  .fnum-seg { display: flex; gap: 7px; }
  .fnum-seg button { flex: 1; height: 40px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--surface-inset); color: var(--text-secondary); font-family: var(--font-body); font-size: 13px; font-weight: 700; cursor: pointer; }
  .fnum-seg button:hover { border-color: var(--border-strong); }
  .fnum-seg button.sel[data-n="0"] { background: var(--surface-hover); color: var(--text-primary); border-color: var(--border-strong); }
  .fnum-seg button.sel.n1 { background: rgba(31,138,91,.18); color: #4FCB8B; border-color: #1F8A5B; }
  .fnum-seg button.sel.n2 { background: var(--warn-soft); color: var(--warn-400); border-color: var(--warn-400); }
  .fnum-seg button.sel.n3 { background: var(--alert-soft); color: var(--alert-400); border-color: var(--alert-400); }
  .chip.fnum { font-weight: 700; }
  .chip.fnum.n1 { color: #4FCB8B; border-color: rgba(31,138,91,.45); background: rgba(31,138,91,.12); }
  .chip.fnum.n2 { color: var(--warn-400); border-color: rgba(223,174,78,.45); background: var(--warn-soft); }
  .chip.fnum.n3 { color: var(--alert-400); border-color: rgba(224,105,91,.5); background: var(--alert-soft); }
  .chip.inv { color: #C98A5E; border-color: rgba(201,138,94,.4); }
  .chip.pref { color: var(--secure-400); border-color: rgba(87,187,223,.4); background: rgba(87,187,223,.1); }
  .crm-btn.del { flex: none; border-color: rgba(224,105,91,.35); color: var(--alert-400); }
  .crm-btn.del:hover { background: var(--alert-soft); border-color: var(--alert-400); }
  /* Contact action buttons (Call / Message / WhatsApp) */
  .dactions { display: flex; gap: 8px; flex-wrap: wrap; }
  .dtpl { margin-top: 4px; }
    .dtpl .tpl-lab { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 9px; }
    .dtpl .tpl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .dtpl .tpl-name { flex: 0 0 118px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .dtpl a, .dtpl button { flex: 1; min-width: 68px; display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 10px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--surface-inset); color: var(--text-primary); font-family: var(--font-body); font-size: 12.5px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .dtpl a:hover, .dtpl button:hover { border-color: var(--signal-500); }
    .dtpl a.wa { color: #25D366; }
    .dactions a { flex: 1; min-width: 92px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--surface-inset); color: var(--text-primary); font-family: var(--font-body); font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .dactions a:hover { border-color: var(--signal-500); background: var(--accent-soft); }
  .dactions a svg { width: 16px; height: 16px; }
  .dactions a.wa { color: #25D366; border-color: rgba(37,211,102,.4); }
  .dactions a.wa:hover { background: rgba(37,211,102,.12); }
  .dactions a.gm { color: #E4756B; border-color: rgba(228,117,107,.4); }
  .dactions a.gm:hover { background: rgba(228,117,107,.12); }
  .dinfo .cpy { margin-left: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-default);
    background: var(--surface-inset); color: var(--text-secondary); font-family: var(--font-body);
    font-size: 11px; font-weight: 600; line-height: 1.6; cursor: pointer; vertical-align: middle; }
  .dinfo .cpy:hover { border-color: var(--signal-500); color: var(--text-primary); }
  .dinfo .cpy.done { border-color: var(--secure-400, #2FA1CC); color: var(--secure-400, #2FA1CC); }
  /* Undo toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--surface-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 12px 14px 12px 18px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-lg, 0 10px 40px rgba(0,0,0,.4)); z-index: 120; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast .msg { font-size: 14px; color: var(--text-primary); }
  .toast button { background: transparent; border: none; color: var(--signal-300); font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px 10px; border-radius: 7px; }
  .toast button:hover { background: var(--accent-soft); }
  .dfield input:focus, .dfield select:focus, .dfield textarea:focus { outline: none; border-color: var(--signal-500); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dinfo { background: var(--surface-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .dinfo b { color: var(--text-primary); }
  .dinfo a { color: var(--signal-300); }
  .drawer-foot { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border-subtle); display: flex; gap: 10px; }
  .drawer-foot .crm-btn { flex: 1; height: 48px; justify-content: center; }

  .banner { display: none; background: var(--warn-soft); border: 1px solid rgba(223,174,78,.3); color: var(--text-secondary); border-radius: var(--radius-md); padding: 12px 15px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .banner b { color: var(--warn-400); }
  .banner a { color: var(--signal-300); }

  /* An author `display` beats the browser's [hidden] rule, so .tabs (flex) and
     .board (grid) stayed visible when the dashboard hid them. */
  [hidden] { display: none !important; }

  /* Stage tabs */
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .tabs button { flex: none; display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; border-radius: 999px;
    border: 1px solid var(--border-default); background: var(--surface-1); color: var(--text-secondary);
    font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s, color .15s; }
  .tabs button:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .tabs button.on { background: var(--signal-500); border-color: var(--signal-500); color: #06212C; }
  /* count badge - the number is the point, so give it weight */
  .tabs button .n { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px;
    padding: 0 8px; border-radius: 999px; background: rgba(180,196,210,.12); color: var(--text-primary);
    font-family: var(--font-display); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .tabs button.on .n { background: rgba(6,33,44,.22); color: #06212C; }
  .tabs button .n.zero { opacity: .45; font-weight: 600; }
  /* Channel filter — how the enquiry reached us, or how to reply. Smaller than
     the stage tabs so it reads as a refinement of them, not a second set. */
  .chans { display: flex; gap: 7px; overflow-x: auto; margin: -8px 0 16px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .chans button { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border-default); background: var(--surface-inset); color: var(--text-secondary);
    font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; }
  .chans button:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .chans button.on { background: var(--accent-soft); border-color: var(--signal-500); color: var(--text-primary); }
  .chans button .n { font-weight: 700; opacity: .75; font-size: 12px; }
  .chans button.on .n { opacity: 1; }
  .chans .ch-lab { align-self: center; flex: none; font-size: 12px; color: var(--text-muted); padding-right: 2px; }
  @media (max-width: 720px) { .chans { gap: 6px; } .chans button { padding: 7px 11px; font-size: 12.5px; } .chans .ch-lab { display: none; } }
  @media (max-width: 720px) {
    .tabs { gap: 6px; margin-bottom: 14px; }
    .tabs button { padding: 10px 14px; font-size: 13.5px; gap: 8px; }
    .tabs button .n { min-width: 22px; height: 21px; font-size: 12.5px; padding: 0 6px; }
  }

  /* Collapsible stage columns */
  .col-h { cursor: pointer; user-select: none; -webkit-user-select: none; }
  .col-h .caret { margin-left: 8px; font-size: 11px; color: var(--text-muted); transition: transform .15s; }
  .col.closed .col-h .caret { transform: rotate(-90deg); }
  .col.closed .col-body, .col.closed .col-sum { display: none; }
  .col-h:active { opacity: .75; }

  @media (max-width: 720px) {
    .crm-shell { padding: 12px 10px 60px; }
    .board { grid-auto-flow: row; grid-auto-columns: auto; gap: 10px; }
    .crm-head { flex-wrap: wrap; gap: 8px; row-gap: 10px; }
    .crm-head h1 { font-size: 20px; width: auto; }
    .crm-head .spacer { display: none; }
    .crm-search { order: 10; flex: 1 1 100%; min-width: 0; }
    .crm-btn, .crm-btn.primary { padding: 9px 12px; font-size: 13px; }
    .pill { font-size: 11.5px; }
    /* dashboard: two tiles per row, roomier charts */
    .dash-tiles { grid-template-columns: 1fr 1fr; gap: 9px; }
    .tile { padding: 12px 12px; }
    .tile .v { font-size: 22px; }
    .tile .k { font-size: 9.5px; }
    .tile .s { font-size: 11px; }
    .dash-charts { grid-template-columns: 1fr; gap: 10px; }
    .cols { height: 100px; }
    /* drawer fills the screen */
    /* keep the drawer a fixed 440px; only go full-width when the screen is narrower than that */
    .dactions a { min-width: 0; font-size: 12.5px; }
    .dtpl .tpl-name { flex: 1 1 100%; }
    .dtpl a, .dtpl button { min-width: 0; font-size: 12px; padding: 0 8px; }
  }
  @media (max-width: 470px) {
    .drawer { width: 100vw; }
    .drawer-body { padding: 16px 14px; }
    .dactions { gap: 6px; }
    .dfield select, .dfield input { font-size: 14px; }
  }
  @media (max-width: 400px) {
    .dash-tiles { grid-template-columns: 1fr 1fr; }
    .tile .v { font-size: 20px; }
  }
  /* Gate */
  #gate { position: fixed; inset: 0; z-index: 9999; background: var(--bg-base); display: grid; place-items: center; padding: 22px; }
  #gate .box { width: 100%; max-width: 340px; text-align: center; }
  #gate img { height: 28px; margin: 0 0 24px; }

<script>
window.__crmStart = function(){
  var SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyH3AZWwJwRs-guZUHtQdZG_-9wfajGhrkiFv2JMN_BrnB6KCJaJR4NQJdN69cSZOQRog/exec';
  var STAGES = [
    { key:'New',       color:'#8FD6EE' },
    { key:'Call back',    color:'#E8A33D' },
    { key:'Contacted', color:'#B3BCC2' },
    { key:'Quoted',    color:'#DFAE4E' },
    { key:'Booked',       color:'#57BBDF' },
    { key:'Deposit paid', color:'#4FA3A5' },
    { key:'Invoice sent', color:'#C98A5E' },
    { key:'Completed',    color:'#1F8A5B' },
    { key:'On Hold',      color:'#9B8CC4' },
    { key:'Lost',         color:'#E0695B' },
    { key:'Archive',      color:'#5C6B78' }
  ];
  var $ = function(id){ return document.getElementById(id); };
  var data = [];          // all enquiries
  var current = null;     // enquiry open in drawer
  var dragKey = null;

  // seed status dropdown
  STAGES.forEach(function(s){ var o=document.createElement('option'); o.value=s.key; o.textContent=s.key; $('dStatus').appendChild(o); });

  function esc(t){ var d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; }
  function statusOf(e){ var s=(e.status||'').toString().trim(); return STAGES.some(function(x){return x.key===s;}) ? s : 'New'; }
  function valNum(e){ var v=parseFloat(String(e.value||'').replace(/[^0-9.]/g,'')); return isNaN(v)?0:v; }
  function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function fuDate(e){ if(!e.followup) return null; var d=new Date(e.followup); return isNaN(d)?null:d; }
  function isClosedOut(st){ return st==='Completed' || st==='Lost' || st==='Archive'; }
  function isOverdue(e){ var d=fuDate(e); if(!d) return false; if(isClosedOut(statusOf(e))) return false; return d<=today(); }
  function vehicle(e){ return [e.make,e.model].filter(Boolean).join(' '); }
  /* Turn raw service/source text into something readable on a card. */
  var CATS = [
    ['Calls',              /missed call/i],
    ['Trade & dealership', /dealership|trade rate|referral/i],
    ['Vehicle security',   /tracker|immobilis|immobiliz|meta ?trak|deadlock|ghost|thatcham|\bs5\b|\bs7\b|security assessment|security/i],
    ['CarPlay & Android',  /carplay|car ?play|android auto/i],
    ['Dash cameras',       /dash ?cam|thinkware/i],
    ['BMW & MINI',         /idrive|i-drive|coding|software recovery|bmw ?\/? ?mini/i],
    ['Battery & recovery', /battery|recovery|jump ?start/i],
    ['Concierge',          /concierge|storage|detailing|chauffeur|sourcing/i]
  ];
  /* Populate the drawer's category picker. Must run after CATS is assigned -
     it previously sat higher up the file and threw on `CATS.map` before the
     array existed, which killed the whole script and blanked the page. */
  (function(){
    var sel=$('dCategory'); if(!sel) return;
    var auto=document.createElement('option'); auto.value=''; auto.textContent='Auto — from the enquiry';
    sel.appendChild(auto);
    CATS.map(function(c){ return c[0]; }).concat(['Other']).forEach(function(name){
      var o=document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o);
    });
  })();

  /* A phone lead. The sheet still stores the service as "Missed call" - that is
     what the Gmail sync writes and what older rows contain - but the board only
     ever shows it as a call. */
  function isCall(e){ return /missed call/i.test(serviceOf(e)) || /missed call/i.test((e.category||'').toString()); }
  /* Rows categorised by hand before the category was renamed. */
  function categoryLegacy_(v){ return /^missed call$/i.test(v) ? 'Calls' : v; }
  function categoryOf(e){
    var set = categoryLegacy_((e.category||'').toString().trim());
    if(set) return set;                       /* chosen by hand in the drawer */
    var hay = [serviceOf(e), e.source||'', e.details||''].join(' ');
    for(var i=0;i<CATS.length;i++){ if(CATS[i][1].test(hay)) return CATS[i][0]; }
    return 'Other';
  }
  /* Filter by how the enquiry reached us, or how they want to be answered.
     A record can sit in more than one of these: a website form where they chose
     WhatsApp is a WhatsApp lead, and an emailed enquiry is an Email lead whether
     the Gmail sync imported it or they typed an address into a form. */
  var CHANS = [
    { key:'',         label:'All' },
    { key:'call',     label:'Calls' },
    { key:'whatsapp', label:'WhatsApp' },
    { key:'email',    label:'Email' }
  ];
  var CHAN_KEY = 'acr_crm_chan';
  function curChan(){
    var v = localStorage.getItem(CHAN_KEY) || '';
    return CHANS.some(function(c){ return c.key === v; }) ? v : '';
  }
  function matchChan(e, key){
    if(!key) return true;
    var pref = prefContact(e).toLowerCase();
    var src  = (e.source||'').toLowerCase();
    if(key === 'call')     return isCall(e) || src === 'phone' || pref === 'phone';
    if(key === 'whatsapp') return pref === 'whatsapp';
    if(key === 'email')    return src === 'gmail' || pref === 'email' || (!!(e.email||'').toString().trim() && !pref);
    return true;
  }

  /* How the enquiry reached us. */
  function channelOf(e){
    var src=(e.source||'').toLowerCase();
    if(src==='phone') return 'Phone';
    if(src==='gmail') return 'Email';
    /* Records built from a Tide invoice never came through the website - counting
       them as web enquiries would overstate what the site brings in. */
    if(src==='tide')  return 'Invoiced';
    if(src) return 'Website';
    return '';
  }
  function serviceOf(e){ return e.service||e.interested||e.interestedIn||''; }
  /* What the card shows. "Missed call" is how it arrives; on the board it is
     simply a call - the time next to it already says it went unanswered. */
  function serviceLabel(e){ var s=serviceOf(e); return /missed call/i.test(s) ? 'Call' : s; }
  /* Open the chat in WhatsApp BUSINESS, not the personal app.
     wa.me hands off to whichever WhatsApp the phone treats as default, which on
     a handset with both installed is usually the personal one. Android lets us
     name the app we want (com.whatsapp.w4b) and give wa.me as the fallback, so
     the button still works on a phone that only has one of them. iOS gives us no
     way to choose - both apps claim the same whatsapp:// scheme - so there it
     stays on wa.me and opens whichever iOS decides. */
  var IS_ANDROID = /android/i.test(navigator.userAgent||'');
  function waLink(digits, text){
    var t = text ? '?text='+encodeURIComponent(text) : '';
    var web = 'https://wa.me/'+digits+t;
    if(!IS_ANDROID) return web;
    return 'intent://send?phone='+digits+(text?'&text='+encodeURIComponent(text):'')
         + '#Intent;scheme=smsto;package=com.whatsapp.w4b'
         + ';S.browser_fallback_url='+encodeURIComponent(web)+';end';
  }
  /* Open the real app, not a web page, when we are on a phone.
     The pattern is the same for both: point the link at the app's own URL scheme
     and fall back to the web address if nothing takes over. On iOS we have to do
     it on click, through a hidden iframe - an iframe means no "address invalid"
     dialog when the app is not installed. On Android the intent:// form carries
     both the package name and the fallback, so the href alone is enough. */
  var IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent||'')
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function androidIntent(path, scheme, pkg, webUrl){
    return 'intent://' + path + '#Intent;scheme=' + scheme + ';package=' + pkg
         + ';S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
  }
  if(IS_IOS){
    /* a.wa -> WhatsApp Business, a.gm[data-app] -> the Gmail app. */
    document.addEventListener('click', function(ev){
      var a = ev.target && ev.target.closest ? ev.target.closest('a.wa, a.gm[data-app]') : null;
      if(!a) return;
      var web = a.getAttribute('href') || '', deep = '';
      if(a.classList.contains('wa')){
        if(web.indexOf('https://wa.me/') !== 0) return;
        deep = web.replace('https://wa.me/', 'whatsapp-smb://send?phone=').replace('?text=', '&text=');
      } else {
        deep = a.getAttribute('data-app') || '';
      }
      if(!deep) return;
      ev.preventDefault();
      var fr = document.createElement('iframe');
      fr.style.display = 'none'; fr.src = deep;
      document.body.appendChild(fr);
      var fall = setTimeout(function(){ window.location.href = web; }, 900);
      document.addEventListener('visibilitychange', function(){
        if(document.hidden) clearTimeout(fall);       /* the app took over */
      }, { once: true });
      setTimeout(function(){ if(fr.parentNode) fr.parentNode.removeChild(fr); }, 1600);
    }, true);
  }

  /* Copy to clipboard, with the pre-2018 fallback for good measure, and a bit of
     feedback on the button that pressed it. */
  function copyText(text, btn){
    var done = function(){
      if(!btn) return;
      var was = btn.textContent;
      btn.textContent = 'Copied'; btn.classList.add('done');
      setTimeout(function(){ btn.textContent = was; btn.classList.remove('done'); }, 1400);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(err){}
      document.body.removeChild(ta); done();
    }
  }

  /* Reply from the ACR inbox, not whatever the device thinks is its mail app.
     mailto: opens Apple Mail on a phone, which is signed in as the wrong
     account; this opens Gmail's composer prefilled instead. Enquiries the Gmail
     sync imported carry a threadId, so for those we can drop straight into the
     existing conversation and keep the reply threaded. */
  var GMAIL_USER = 0;            // the ACR account's index in Gmail (0 = first)
  function gmailWeb(to, subject, body){
    return 'https://mail.google.com/mail/u/' + GMAIL_USER + '/?view=cm&fs=1&tf=1'
         + '&to=' + encodeURIComponent(to)
         + '&su=' + encodeURIComponent(subject || '')
         + '&body=' + encodeURIComponent(body || '');
  }
  /* The Gmail APP's own composer. Same query on both platforms - iOS reaches it
     through googlegmail:///co, Android through the intent above. Desktop has no
     app to open, so it keeps the web composer. */
  function gmailApp(to, subject, body){
    return 'co?to=' + encodeURIComponent(to)
         + '&subject=' + encodeURIComponent(subject || '')
         + '&body=' + encodeURIComponent(body || '');
  }
  /* Returns the href, plus the data-app attribute iOS needs, as one string. */
  function gmailLink(to, subject, body){
    var web = gmailWeb(to, subject, body), q = gmailApp(to, subject, body);
    if(IS_ANDROID) return 'href="' + androidIntent(q, 'googlegmail', 'com.google.android.gm', web) + '"';
    if(IS_IOS)     return 'href="' + web + '" data-app="googlegmail:///' + q + '"';
    return 'href="' + web + '"';
  }
  function gmailThread(threadId){
    return 'https://mail.google.com/mail/u/' + GMAIL_USER + '/#all/'
         + encodeURIComponent(String(threadId || '').trim());
  }

  /* Straight into the booking console with the job's details already filled in.
     Used by the drawer's "Book this" and by the Book button on each card, so the
     two cannot drift apart. */
  function bookHref(e){
    /* Everything the record holds that the booking form asks for. Year and
       registration were missing, so those boxes sat empty on a record that had
       them. */
    var p = new URLSearchParams({
      name: nameOf(e), email: e.email||'', phone: e.mobile||'',
      make: e.make||'', model: e.model||'', year: (e.year||'').toString().trim(),
      reg: (e.registration||'').toString().trim(),
      postcode: (e.postcode||'').toString().trim(),
      service: serviceLabel(e),
      invoice: (e.invoiceRef||'').toString().trim(),          /* filed by the Tide sync */
      invoiceLink: (e.invoiceLink||'').toString().trim()
    });
    return 'booking-console-a7c93f.html#' + p.toString();
  }

  /* Unnamed callers are stored as "Missed call 07…" by the Gmail sync. */
  function nameOf(e){ return (e.name||'').toString().replace(/^missed call\b/i,'Call'); }
  function prefContact(e){ return (e.preferredReply||e.preferredreply||e.preferred||'').toString().trim(); }
  function isDeleted(e){ var v=(e.deleted||'').toString().toLowerCase(); return v==='true'||v==='1'||v==='yes'; }
  function fnum(e){ var n=parseInt(e.followups,10); return (n>=1&&n<=3)?n:0; }
  function ukPhone(raw){
    var p=(raw||'').toString().replace(/[^\d+]/g,''); if(!p) return '';
    var nat;
    if(p.charAt(0)==='+'){ if(p.indexOf('+44')===0) nat=p.slice(3); else return p; }
    else if(p.slice(0,2)==='44') nat=p.slice(2);
    else if(p.charAt(0)==='0') nat=p.slice(1);
    else nat=p;
    nat=nat.replace(/\D/g,''); if(!nat) return '+44';
    var g = nat.length===10 ? nat.slice(0,4)+' '+nat.slice(4) : nat;
    return '+44 '+g;
  }
  /* When it came in, e.g. "29 Jul, 15:10". Missed calls are only useful if you
     can see the time without opening the card. */
  function whenOf(e){
    if(!e.timestamp) return '';
    var d=new Date(e.timestamp);
    if(isNaN(d)) return '';
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})
         + ', ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
  }
  function money(n){ return '£'+n.toLocaleString('en-GB'); }
  function fmtD(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }

  /* ---------- Dashboard ---------- */
  function weekStart(d){ var x=new Date(d); var day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
  /* limit defaults to 6; pass 0 to show every non-zero row. The stage chart
     must never truncate - dropping Completed off the end made it look as
     though nothing had ever been won. */
  function bars(elId, pairs, unit, limit){
    var el=$(elId); if(!el) return;
    pairs=pairs.filter(function(p){ return p[1]>0; }).sort(function(a,b){ return b[1]-a[1]; });
    if(limit !== 0) pairs = pairs.slice(0, limit || 6);
    if(!pairs.length){ el.innerHTML='<div class="empty">Nothing yet.</div>'; return; }
    var max=pairs[0][1];
    el.innerHTML = pairs.map(function(p){
      var pc=Math.max(3, Math.round(p[1]/max*100));
      return '<div class="row" title="'+esc(p[0])+': '+p[1]+(unit||'')+'">'
           +   '<span class="lab">'+esc(p[0])+'</span><span class="num">'+p[1]+(unit||'')+'</span>'
           +   '<span class="track"><span class="fill" style="width:'+pc+'%"></span></span>'
           + '</div>';
    }).join('');
  }
  (function(){
    var cb=$('dashArch'); if(!cb) return;
    cb.checked = localStorage.getItem('acr_crm_dash_arch')==='1';
    cb.addEventListener('change', function(){
      localStorage.setItem('acr_crm_dash_arch', cb.checked?'1':'0');
      renderDash();
    });
  })();

  /* Time buckets for the trend chart. Eight weeks stays weekly; every longer
     range is grouped by month, because 52 weekly bars is unreadable. */
  function buckets_(range, now){
    var out=[], i, a, b;
    if(range==='8w'){
      var w=weekStart(now);
      for(i=7;i>=0;i--){
        a=new Date(w); a.setDate(a.getDate()-i*7);
        b=new Date(a); b.setDate(b.getDate()+7);
        out.push({from:a, to:b, label:a.getDate()+'/'+(a.getMonth()+1)});
      }
      return out;
    }
    var months = range==='ytd' ? (now.getMonth()+1) : parseInt(range,10) || 3;
    for(i=months-1;i>=0;i--){
      a=new Date(now.getFullYear(), now.getMonth()-i, 1);
      b=new Date(a.getFullYear(), a.getMonth()+1, 1);
      out.push({from:a, to:b, label:a.toLocaleDateString('en-GB',{month:'short'})});
    }
    return out;
  }
  function rangeLabel_(r){
    if(r==='8w')  return 'last 8 weeks';
    if(r==='ytd') return 'year to date';
    return 'last ' + parseInt(r,10) + ' months';
  }
  (function(){
    var sel=$('chRange'); if(!sel) return;
    sel.value = localStorage.getItem('acr_crm_range') || '8w';
    sel.addEventListener('change', function(){
      localStorage.setItem('acr_crm_range', sel.value);
      renderDash();
    });
  })();

  /* Best and quietest periods. Only periods from the first record onwards count,
     otherwise "quietest" is always an empty month from before the CRM existed. */
  function periodStats_(list, unit, now){
    var dates = list.map(function(e){ return e.timestamp ? new Date(e.timestamp) : null; })
                    .filter(function(d){ return d && !isNaN(d); });
    if(!dates.length) return null;
    var first = new Date(Math.min.apply(null, dates));
    var keyOf, labelOf, step;
    if(unit==='week'){
      keyOf   = function(d){ return weekStart(d).getTime(); };
      labelOf = function(t){ var d=new Date(t); return 'w/c '+d.getDate()+'/'+(d.getMonth()+1); };
      step    = function(d){ var x=new Date(d); x.setDate(x.getDate()+7); return x; };
      first   = weekStart(first);
    } else {
      keyOf   = function(d){ return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
      labelOf = function(t){ return new Date(t).toLocaleDateString('en-GB',{month:'short',year:'2-digit'}); };
      step    = function(d){ return new Date(d.getFullYear(), d.getMonth()+1, 1); };
      first   = new Date(first.getFullYear(), first.getMonth(), 1);
    }
    var counts={}, cur=new Date(first);
    while(cur <= now){ counts[keyOf(cur)] = 0; cur = step(cur); }
    dates.forEach(function(d){ var k=keyOf(d); if(k in counts) counts[k]++; });
    var keys=Object.keys(counts);
    if(!keys.length) return null;
    /* The current week/month is still running, so it nearly always holds the
       lowest count - on a Monday morning it is zero. Naming it the quietest
       period is wrong, so only finished periods compete for that. The busiest
       can still be the one in progress: that is real news. */
    var curKey = String(keyOf(now));
    var done = keys.filter(function(k){ return k !== curKey; });
    var best = keys[0], worst = done.length ? done[0] : null;
    keys.forEach(function(k){ if(counts[k] > counts[best]) best = k; });
    done.forEach(function(k){ if(counts[k] <= counts[worst]) worst = k; });
    return { best:{label:labelOf(+best), n:counts[best]},
             worst: worst===null ? null : {label:labelOf(+worst), n:counts[worst]},
             periods: done.length };
  }
  /* Which category led in each month - the seasonal picture. Security tends to
     spike after local theft, CarPlay around plate changes, and this is where
     that shows up. */
  function renderLead_(live, now){
    var el=$('chLead'); if(!el) return;
    var byMonth={};
    live.forEach(function(e){
      if(!e.timestamp) return;
      var d=new Date(e.timestamp); if(isNaN(d)) return;
      var k=new Date(d.getFullYear(), d.getMonth(), 1).getTime();
      var c=categoryOf(e) || 'Other';
      (byMonth[k] = byMonth[k] || {})[c] = ((byMonth[k]||{})[c] || 0) + 1;
    });
    var keys=Object.keys(byMonth).sort(function(a,b){ return b-a; }).slice(0,6);
    if(!keys.length){ el.innerHTML='<div class="empty">Nothing yet.</div>'; return; }
    var thisMonth=new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    el.innerHTML = keys.map(function(k){
      var cats=byMonth[k], top=null, n=0, total=0;
      Object.keys(cats).forEach(function(c){ total+=cats[c]; if(cats[c]>n){ n=cats[c]; top=c; } });
      var share = total ? Math.round(n/total*100) : 0;
      var lbl = new Date(+k).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
      var isNow = String(k)===String(thisMonth);
      return '<div class="r"'+(isNow?' style="background:rgba(47,161,204,.07);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:6px"':'')+'>'
           +   '<span class="k">'+esc(lbl)+(isNow?' · so far':'')+'</span>'
           +   '<span class="w">'+esc(top||'—')+'</span>'
           +   '<span class="v">'+n+'</span>'
           + '</div>'
           + '<div style="font-size:11px;color:var(--text-muted);margin:-4px 0 6px">'+share+'% of that month\u2019s enquiries</div>';
    }).join('');
  }

  function renderBest_(live, now){
    var el=$('chBest'); if(!el) return;
    var wk=periodStats_(live,'week',now), mo=periodStats_(live,'month',now);
    if(!wk && !mo){ el.innerHTML='<div class="empty">Not enough history yet.</div>'; return; }
    var rows=[];
    function add(k, st, which){
      if(!st || !st[which]) return;
      rows.push('<div class="r"><span class="k">'+k+'</span><span class="w">'+esc(st[which].label)+'</span>'
              + '<span class="v'+(which==='worst'?' low':'')+'">'+st[which].n+'</span></div>');
    }
    add('Busiest week',  wk, 'best');
    if(wk && wk.periods>1) add('Quietest week', wk, 'worst');
    add('Busiest month', mo, 'best');
    if(mo && mo.periods>1) add('Quietest month', mo, 'worst');
    el.innerHTML = rows.join('')
      + (mo && mo.periods>=1 && mo.periods<3
          ? '<div class="empty" style="margin-top:10px">Based on '+mo.periods
            +' completed month'+(mo.periods===1?'':'s')+', plus this one so far.</div>'
          : '');
  }

  function renderDash(){
    var box=$('dash'); if(!box || box.hidden) return;
    /* Archived records are historic clean-up, not performance. They stay out
       of every tile and chart unless the box is ticked. */
    var withArch = localStorage.getItem('acr_crm_dash_arch')==='1';
    var live = data.filter(function(e){
      if(isDeleted(e)) return false;
      return withArch || statusOf(e)!=='Archive';
    });
    var open = live.filter(function(e){ return !isClosedOut(statusOf(e)); });
    var won  = live.filter(function(e){ return statusOf(e)==='Completed'; });
    var lost = live.filter(function(e){ return statusOf(e)==='Lost'; });
    var now=new Date(), wk0=weekStart(now), prev=new Date(wk0); prev.setDate(prev.getDate()-7);
    var ts=function(e){ return e.timestamp? new Date(e.timestamp) : null; };
    var thisWk = live.filter(function(e){ var d=ts(e); return d && d>=wk0; }).length;
    var lastWk = live.filter(function(e){ var d=ts(e); return d && d>=prev && d<wk0; }).length;
    var pipe = open.reduce(function(a,e){ return a+valNum(e); },0);
    var wonV = won.reduce(function(a,e){ return a+valNum(e); },0);
    var decided = won.length+lost.length;
    var conv = decided? Math.round(won.length/decided*100) : null;
    var due = live.filter(function(e){ return isOverdue(e); }).length;
    /* Compare this week against the SAME point last week, not the whole of it.
       On a Monday morning a part-week against a full one reported "-31 vs last
       week", which looks like the phone has stopped ringing when it hasn't. */
    var sameLast = new Date(prev.getTime() + (now.getTime()-wk0.getTime()));
    var lastWkSoFar = live.filter(function(e){ var d=ts(e); return d && d>=prev && d<sameLast; }).length;
    var delta = thisWk-lastWkSoFar;
    var tiles=[
      ['New this week', thisWk, (lastWk||delta) ? (delta>0?'+':'')+delta+' vs same point last week' : 'first week of data'],
      ['Open enquiries', open.length, live.length+' total on record'],
      ['Pipeline value', pipe?money(pipe):'—', pipe? open.filter(function(e){return valNum(e)>0;}).length+' with a value set' : 'no values entered yet'],
      ['Won', won.length, wonV?money(wonV)+' recorded':'no values entered yet'],
      ['Conversion', conv===null?'—':conv+'%', decided? won.length+' won / '+lost.length+' lost' : 'nothing closed yet'],
      ['Follow-ups due', due, due? 'needs chasing today' : 'all clear']
    ];
    $('dashTiles').innerHTML = tiles.map(function(t){
      return '<div class="tile"><div class="k">'+esc(t[0])+'</div><div class="v">'+esc(String(t[1]))+'</div><div class="s">'+esc(t[2])+'</div></div>';
    }).join('');
    var cnt=function(arr, fn){ var m={}; arr.forEach(function(e){ var k=(fn(e)||'').toString().trim(); if(k) m[k]=(m[k]||0)+1; }); return Object.keys(m).map(function(k){ return [k,m[k]]; }); };
    bars('chStage',   STAGES.map(function(st){ return [st.key, live.filter(function(e){ return statusOf(e)===st.key; }).length]; }), '', 0);
    bars('chSource',  cnt(live, categoryOf), '', 8);
    bars('chService', cnt(live, channelOf));
    var range = localStorage.getItem('acr_crm_range') || '8w';
    var cols = buckets_(range, now).map(function(b){
      return [b.label, live.filter(function(e){ var d=ts(e); return d && d>=b.from && d<b.to; }).length];
    });
    var titleEl=$('chWeeksTitle');
    if(titleEl) titleEl.textContent = 'Enquiries, ' + rangeLabel_(range);
    var mx=Math.max(1, Math.max.apply(null, cols.map(function(c){ return c[1]; })));
    var wrap=$('chWeeks');
    wrap.className = 'cols' + (cols.length>8 ? ' many' : '');
    wrap.innerHTML = cols.map(function(c){
      var h = c[1] ? Math.max(6, Math.round(c[1]/mx*104)) : 2;
      var lab=c[0];
      return '<div class="c" title="'+esc(lab)+': '+c[1]+' enquir'+(c[1]===1?'y':'ies')+'">'
           +   '<span class="cv">'+(c[1]||'')+'</span>'
           +   '<span class="bar'+(c[1]?'':' zero')+'" style="height:'+h+'px"></span>'
           +   '<span class="wl">'+lab+'</span></div>';
    }).join('');

    renderBest_(live, now);
    renderLead_(live, now);
  }

  /* Top-level views. Keeps the working pipeline free of closed-out records. */
  var GROUPS = [
    { key:'pipeline',  label:'Pipeline',  stages:['New','Call back','Contacted','Quoted','Booked','Deposit paid','Invoice sent','On Hold','Completed','Lost'] },
    { key:'onhold',    label:'On Hold',   stages:['On Hold'] },
    { key:'archive',   label:'Archive',   stages:['Archive','Completed','Lost'] },
    { key:'all',       label:'All',       stages:null }
  ];
  var TAB_KEY='acr_crm_tab';
  function curTab(){ return localStorage.getItem(TAB_KEY) || 'pipeline'; }
  function groupOf(k){ return GROUPS.filter(function(g){ return g.key===k; })[0] || GROUPS[0]; }
  function renderTabs(){
    var el=$('tabs'); if(!el) return;
    var live=data.filter(function(e){ return !isDeleted(e); });
    el.innerHTML = GROUPS.map(function(g){
      var n = g.stages ? live.filter(function(e){ return g.stages.indexOf(statusOf(e))>-1; }).length : live.length;
      return '<button type="button" data-tab="'+g.key+'"'+(curTab()===g.key?' class="on"':'')+'>'
           +   esc(g.label)+'<span class="n'+(n?'':' zero')+'">'+n+'</span></button>';
    }).join('');
    el.querySelectorAll('button[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){
        localStorage.setItem(TAB_KEY, b.getAttribute('data-tab'));
        render();
      });
    });
  }

  function renderChans(){
    var el=$('chans'); if(!el) return;
    var g = groupOf(curTab());
    /* Counts respect the stage tab you are on, so they match what the board
       would show rather than the whole sheet. */
    var live = data.filter(function(e){
      return !isDeleted(e) && (!g.stages || g.stages.indexOf(statusOf(e))>-1);
    });
    var cur = curChan();
    el.innerHTML = '<span class="ch-lab">Channel</span>' + CHANS.map(function(c){
      var n = live.filter(function(e){ return matchChan(e, c.key); }).length;
      return '<button type="button" data-chan="'+c.key+'"'+(cur===c.key?' class="on"':'')+'>'
           +   esc(c.label)+'<span class="n">'+n+'</span></button>';
    }).join('');
    el.querySelectorAll('button[data-chan]').forEach(function(b){
      b.addEventListener('click', function(){
        localStorage.setItem(CHAN_KEY, b.getAttribute('data-chan'));
        render();
      });
    });
  }

  /* Which stage columns are collapsed. Remembered per device. */
  var CLOSED_KEY='acr_crm_closed';
  function closedSet(){
    try { return JSON.parse(localStorage.getItem(CLOSED_KEY)||'[]'); } catch(e){ return []; }
  }
  function isClosed(k){ return closedSet().indexOf(k)>-1; }
  function setClosed(k, on){
    var a=closedSet(), i=a.indexOf(k);
    if(on && i<0) a.push(k); if(!on && i>-1) a.splice(i,1);
    try { localStorage.setItem(CLOSED_KEY, JSON.stringify(a)); } catch(e){}
  }
  /* First visit on a small screen: collapse the closed-out stages so the
     board opens on what still needs working. */
  (function(){
    if(localStorage.getItem(CLOSED_KEY)) return;
    /* Closed-out stages start collapsed on every device: still there to drag
       a card onto, but not taking up the width of a working column. */
    try { localStorage.setItem(CLOSED_KEY, JSON.stringify(['Completed','On Hold','Lost','Archive'])); } catch(e){}
  })();

  function render(){
    var q = ($('search').value||'').toLowerCase().trim();
    var chan = curChan();
    var board = $('board'); board.innerHTML='';
    var due = 0;
    var g = groupOf(curTab());
    var shown = STAGES.filter(function(st){ return !g.stages || g.stages.indexOf(st.key)>-1; });
    shown.forEach(function(s){
      var items = data.filter(function(e){ return !isDeleted(e) && statusOf(e)===s.key; })
        .filter(function(e){ return matchChan(e, chan); })
        .filter(function(e){ if(!q) return true; return (e.name+' '+vehicle(e)+' '+serviceOf(e)+' '+(e.email||'')).toLowerCase().indexOf(q)>-1; })
        .sort(function(a,b){ return new Date(b.timestamp||0)-new Date(a.timestamp||0); });
      var sum = items.reduce(function(t,e){ return t+valNum(e); },0);
      var col = document.createElement('div'); col.className='col'; col.dataset.stage=s.key;
      col.innerHTML = '<div class="col-h"><span class="col-dot" style="background:'+s.color+'"></span>'
        + '<span class="nm">'+s.key+'</span><span class="ct">'+items.length+'</span>'
        + '<span class="caret">&#9660;</span></div>'
        + (sum? '<div class="col-h col-sum" style="padding-top:0;cursor:default"><span class="sum" style="margin-left:18px">'+money(sum)+'</span></div>' : '')
        + '<div class="col-body"></div>';
      if(isClosed(s.key)) col.classList.add('closed');
      col.querySelector('.col-h').addEventListener('click', function(){
        col.classList.toggle('closed');
        setClosed(s.key, col.classList.contains('closed'));
      });
      var body = col.querySelector('.col-body');
      if(!items.length){ body.innerHTML='<div class="empty-col">—</div>'; }
      items.forEach(function(e){
        if(isOverdue(e)) due++;
        var card=document.createElement('div'); card.className='card'+(isOverdue(e)?' overdue':'');
        card.draggable=true; card.dataset.key=e.timestamp;
        var chips=[];
        var fn=fnum(e); if(fn) chips.push('<span class="chip fnum n'+fn+'">Follow-up '+fn+'</span>');
        if(valNum(e)) chips.push('<span class="chip val">'+money(valNum(e))+'</span>');
        var d=fuDate(e); if(d) chips.push('<span class="chip fu'+(isOverdue(e)?' late':'')+'">◔ '+fmtD(d)+'</span>');
        var iv=(e.invoiceRef||'').toString().trim();
        if(iv) chips.push('<span class="chip inv">'+esc(iv)+'</span>');
        var cat=categoryOf(e); if(cat) chips.push('<span class="chip">'+esc(cat)+'</span>');
        var ch=channelOf(e), pcv=prefContact(e);
        /* don't print the same word twice - a phone lead replied to by phone
           was showing "Phone" as both the channel and the preferred reply */
        if(ch && ch.toLowerCase()!==pcv.toLowerCase()) chips.push('<span class="chip">'+esc(ch)+'</span>');
        if(pcv) chips.push('<span class="chip pref">'+esc(pcv)+'</span>');
        card.innerHTML='<div class="nm">'+esc(nameOf(e)||'—')+'</div>'
          +'<div class="meta">'+esc((isCall(e)
              ? [serviceLabel(e), whenOf(e)]
              : [serviceLabel(e), vehicle(e)]).filter(Boolean).join(' · ')||'—')+'</div>'
          +(chips.length?'<div class="row2">'+chips.join('')+'</div>':'')
          /* Booking is the next step for anything still open, so it should not
             need the drawer first. Closed-out records don't get the button. */
          +(isClosedOut(s.key) ? '' :
             '<div class="card-act"><a class="book" href="'+bookHref(e)+'">Book the job \u2192</a></div>');
        card.addEventListener('click', function(){ openDrawer(e); });
        var bk = card.querySelector('a.book');
        if(bk) bk.addEventListener('click', function(ev){ ev.stopPropagation(); });  /* don't open the drawer too */
        card.addEventListener('dragstart', function(ev){ dragKey=e.timestamp; ev.dataTransfer.effectAllowed='move'; });
        body.appendChild(card);
      });
      col.addEventListener('dragover', function(ev){ ev.preventDefault(); col.classList.add('drop'); });
      col.addEventListener('dragleave', function(){ col.classList.remove('drop'); });
      col.addEventListener('drop', function(ev){ ev.preventDefault(); col.classList.remove('drop'); if(dragKey){ setStatus(dragKey, s.key); dragKey=null; } });
      board.appendChild(col);
    });
    var pill=$('fuPill'); pill.textContent = due+' follow-up'+(due===1?'':'s')+' due'; pill.className='pill'+(due?'':' zero');
    renderTabs();
    renderChans();
    renderDash();
  }

  /* Dashboard is a view of its own, not a strip above the board - showing the
     pipeline underneath it just made the page long and neither readable. */
  (function(){
    var btn=$('dashToggle'), box=$('dash');
    if(!btn||!box) return;
    function apply(on){
      box.hidden = !on;
      var tabs=$('tabs'), board=$('board'), chans=$('chans');
      if(tabs)  tabs.hidden  = on;
      if(chans) chans.hidden = on;
      if(board) board.hidden = on;
      btn.classList.toggle('primary', on);
      btn.textContent = on ? '\u2190 Pipeline' : 'Dashboard';
      localStorage.setItem('acr_crm_dash', on?'1':'0');
      if(on) renderDash();
    }
    apply(localStorage.getItem('acr_crm_dash')==='1');   /* board is the default view */
    btn.addEventListener('click', function(){ apply(box.hidden); });
  })();

  (function(){
    var b=$('signOut'); if(!b) return;
    b.addEventListener('click', function(){
      try { sessionStorage.removeItem('acr_bk_auth'); } catch(e){}
      location.reload();
    });
  })();

  function find(key){ return data.filter(function(e){ return String(e.timestamp)===String(key); })[0]; }

  function setStatus(key, status){
    var e=find(key); if(!e) return; e.status=status; render();
    save(key, { status: status });
  }

  // Optimistic write-back (no-cors, can't read response)
  function save(key, fields){
    if(!SHEET_ENDPOINT) return;
    try{ fetch(SHEET_ENDPOINT, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'updateEnquiry', key:key, fields:fields})}).catch(function(){}); }catch(e){}
  }

  // Drawer
  function openDrawer(e){
    current=e;
    $('dName').textContent = nameOf(e)||'—';
    $('dSub').textContent = [serviceLabel(e), vehicle(e)].filter(Boolean).join(' · ');
    var info=[];
    /* A copy button beside each - pasting an address into a quote or an invoice
       beats retyping it, and long-pressing to select text on a phone is fiddly. */
    var copyBtn = function(what, val){
      return ' <button type="button" class="cpy" data-copy="'+esc(val)+'" title="Copy '+what+'">Copy</button>';
    };
    if(e.email) info.push('<b>Email:</b> <a href="mailto:'+esc(e.email)+'">'+esc(e.email)+'</a>'
                          + copyBtn('email address', e.email));
    if(e.mobile) info.push('<b>Mobile:</b> '+esc(ukPhone(e.mobile)) + copyBtn('mobile number', ukPhone(e.mobile)));
    if(e.postcode) info.push('<b>Postcode:</b> '+esc(e.postcode));
    var pc=prefContact(e); if(pc) info.push('<b>Prefers:</b> '+esc(pc));
    if(e.registration) info.push('<b>Reg:</b> '+esc(e.registration));
    /* Filed against this row by the Tide sync: the number, and a link straight to
       the invoice email so the PDF is one click away. */
    var invRef = (e.invoiceRef||'').toString().trim(), invLink = (e.invoiceLink||'').toString().trim();
    if(invRef || invLink){
      info.push('<b>Invoice:</b> ' + (invLink
        ? '<a class="gm" href="'+esc(invLink)+'" target="_blank" rel="noopener">'+esc(invRef||'open in Gmail')+'</a>'
        : esc(invRef)));
    }
    if(e.timestamp){ var d=new Date(e.timestamp); if(!isNaN(d)) info.push('<b>Enquired:</b> '+d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})); }
    $('dInfo').innerHTML = info.join('<br>') || 'No contact details captured.';
    $('dInfo').querySelectorAll('button[data-copy]').forEach(function(b){
      b.addEventListener('click', function(){ copyText(b.getAttribute('data-copy'), b); });
    });
    // Contact action buttons — tap to Call / Message (iMessage/SMS) / WhatsApp
    var act = $('dActions');
    /* Enquiries the Gmail sync imported carry the conversation's threadId, so we
       can jump straight into that thread rather than starting a new mail. */
    var thread = (e.threadId||'').toString().trim();
    var threadBtn = thread
      ? '<a class="gm" href="'+gmailThread(thread)+'" target="_blank" rel="noopener">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>'
        + '<path d="m22 7-10 6L2 7"/></svg>Gmail thread</a>'
      : '';
    if(e.mobile){
      var digits = ukPhone(e.mobile).replace(/\D/g,''); // e.g. 447700900123
      act.style.display='flex';
      act.innerHTML =
        '<a href="tel:+'+digits+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>Call</a>'
      + '<a href="sms:+'+digits+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Message</a>'
      + '<a class="wa" href="'+waLink(digits)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.7-.84-2-.94-.26-.1-.46-.15-.65.15-.2.29-.74.94-.9 1.13-.17.2-.34.22-.63.08-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.64-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.34.44-.51.15-.17.2-.29.3-.49.1-.2.05-.37-.02-.51-.08-.15-.65-1.57-.9-2.15-.24-.56-.48-.48-.65-.49h-.56c-.2 0-.5.07-.77.36-.26.29-1 1-1 2.42 0 1.43 1.03 2.8 1.17 3 .14.2 2.03 3.1 4.92 4.35.69.3 1.22.47 1.64.6.69.22 1.31.19 1.8.12.55-.08 1.7-.7 1.94-1.36.24-.67.24-1.24.17-1.36-.07-.12-.26-.2-.55-.34zM12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2z"/></svg>WhatsApp</a>' + threadBtn;
    } else if(threadBtn){
      act.style.display='flex'; act.innerHTML = threadBtn;
    } else { act.style.display='none'; act.innerHTML=''; }

    /* ---- Quick message templates (follow-up / closing) ---- */
    (function(){
      var box = $('dTemplates');
      /* How to address them. The forms now collect an optional title, so names
         arrive as "Mr Alex Marin" - taking the first word blindly would open a
         message with "Hello Mr,". With a title we use title + surname, which is
         the right register for a quote anyway; without one, the first name.
         Placeholder names ("Call 07…") get no greeting at all. */
      var TITLE_RE = /^(mr|mrs|ms|miss|mx|dr|prof|professor|rev|sir|lady|lord)\.?$/i;
      var nm = nameOf(e).trim();
      var bits = nm.split(/\s+/).filter(Boolean);
      var ttl = (bits.length && TITLE_RE.test(bits[0])) ? bits.shift() : '';
      var first = ttl && bits.length ? ttl + ' ' + bits[bits.length - 1] : (bits[0] || '');
      if(/^call\b/i.test(nm) || /\d/.test(first)) first = '';
      var hi = first ? 'Hello ' + first + ',' : 'Hello,';
      var TPL = [
        { id:'missed', label:'Call reply', subject:'Sorry we missed your call — ACR Automobile',
          body: (first ? 'Hi ' + first + ',' : 'Hi,') + '\n\nThank you for contacting ACR Automobile. We apologise for missing your call.\n\nPlease let us know how we can help?' },
        { id:'follow', label:'Follow-up', subject:'Following up on your enquiry — ACR Automobile',
          body: hi + '\n\nJust a quick follow-up to check if our service is still required.\n\nPlease let us know at your earliest convenience so we can assist you further.' },
        { id:'close', label:'Closing request', subject:'Closing your service request — ACR Automobile',
          body: hi + '\n\nWe have made several attempts to follow up regarding your service request but have not yet received a response.\n\nWe will proceed with closing the request due to no reply received.\n\nShould you still require our services, please feel free to contact us at any time and we will be happy to assist.' },
        { id:'review', label:'Review request', subject:'Thank you from ACR Automobile',
          body: hi + '\n\nACR Automobile would love your feedback. Post a review to our profile.\nhttps://g.page/r/CZPh91CpyERvEBE/review\n\nPlease let us know when you\u2019ve done it. This would help our business a lot.\n\nWe would like to thank you and appreciate you for using our services.' },
        { id:'decline', label:'Unable to help', subject:'Your enquiry \u2014 ACR Automobile',
          body: hi + '\n\nThank you for your enquiry and for considering ACR Automobile.\n\nUnfortunately, we are unable to fulfil this request on this occasion.\n\nWe are sorry that we cannot help this time. Please do keep us in mind for any future work \u2014 we would be glad to hear from you.' }
      ];
      /* Whatever is most likely next for this record goes first: a review once the
         job is done, the decline on one we have turned down, a call-back reply on
         a phone lead, chasing otherwise. */
      var ORDER = {
        'Completed':  ['review','follow','close','decline','missed'],
        'Lost':       ['decline','close','follow','review','missed'],
        'Call back':  ['missed','follow','close','decline','review'],
        'default':    ['follow','close','decline','missed','review']
      };
      var stNow = statusOf(e);
      var order = ORDER[stNow] || (isCall(e) ? ORDER['Call back'] : ORDER['default']);
      TPL.sort(function(a,b){ return order.indexOf(a.id) - order.indexOf(b.id); });
      /* Email goes out under the account's own signature, so signing the body as
         well would sign it twice - the bodies above stop at the last sentence and
         only the chat channels add a sign-off.
         Line breaks: mailto: gets CRLF. Some desktop clients drop a bare \n and
         run the whole message into a single paragraph, which is what happened. */
      var SIGNOFF = '\n\nKind regards,\nACR Automobile';
      var chatBody = function(t){ return t.body + SIGNOFF; };
      var mailBody = function(t){ return t.body.replace(/\r?\n/g, '\r\n'); };
      var digits = e.mobile ? ukPhone(e.mobile).replace(/\D/g,'') : '';
      var mail = (e.email||'').toString().trim();
      if(!digits && !mail){ box.style.display='none'; box.innerHTML=''; return; }
      box.style.display='block';
      var html = '<div class="tpl-lab">Quick messages</div>';
      TPL.forEach(function(t){
        html += '<div class="tpl-row"><span class="tpl-name">'+t.label+'</span>';
        if(digits) html += '<a class="wa" target="_blank" rel="noopener" href="'+waLink(digits, chatBody(t))+'">WhatsApp</a>'
                        +  '<a href="sms:+'+digits+'&body='+encodeURIComponent(chatBody(t))+'">SMS</a>';
        /* The address must NOT be percent-encoded: mailto:alex%40x.com is rejected
           by desktop mail clients, which is why the Email link worked on a phone
           and did nothing on a computer. Gmail is listed first because it works
           whether or not a mail client is set up on the machine. */
        if(mail)   html += '<a class="gm" target="_blank" rel="noopener" '+gmailLink(mail, t.subject, t.body)+'>Gmail</a>'
                        +  '<a href="mailto:'+mail.replace(/"/g,'%22')+'?subject='+encodeURIComponent(t.subject)+'&body='+encodeURIComponent(mailBody(t))+'">Mail app</a>';
        html += '<button type="button" data-tpl="'+t.id+'">Copy</button></div>';
      });
      box.innerHTML = html;
      box.querySelectorAll('button[data-tpl]').forEach(function(b){
        b.addEventListener('click', function(){
          var t = TPL.filter(function(x){ return x.id===b.getAttribute('data-tpl'); })[0];
          copyText(chatBody(t), b);
        });
      });
    })();
    $('dStatus').value = statusOf(e);
    $('dCategory').value = categoryLegacy_((e.category||'').toString().trim());
    $('dValue').value = e.value||'';
    $('dFollowup').value = e.followup ? String(e.followup).slice(0,10) : '';
    $('dOwner').value = e.owner||'';
    $('dNotes').value = e.notes||'';
    setFnumUI(fnum(e));
    $('dBook').href = bookHref(e);
    $('drawer').classList.add('open'); $('drawerBg').classList.add('open');
  }
  function closeDrawer(){ $('drawer').classList.remove('open'); $('drawerBg').classList.remove('open'); current=null; }
  $('dClose').addEventListener('click', closeDrawer);
  $('drawerBg').addEventListener('click', closeDrawer);

  // Follow-up attempt segmented control (0 = none)
  var fnumVal = 0;
  function setFnumUI(n){
    fnumVal = n||0;
    [].forEach.call($('fnumSeg').querySelectorAll('button'), function(b){ b.classList.toggle('sel', parseInt(b.dataset.n,10)===fnumVal); });
  }
  $('fnumSeg').addEventListener('click', function(ev){ var b=ev.target.closest('button'); if(!b) return; setFnumUI(parseInt(b.dataset.n,10)); });
  // Follow-up quick-set buttons
  $('fuQuick').addEventListener('click', function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    var days=parseInt(b.dataset.days,10);
    if(b.classList.contains('clr')){ $('dFollowup').value=''; return; }
    var d=new Date(); d.setDate(d.getDate()+days); $('dFollowup').value=d.toISOString().slice(0,10);
  });
  $('dSave').addEventListener('click', function(){
    if(!current) return;
    current.status=$('dStatus').value; current.category=$('dCategory').value; current.value=$('dValue').value; current.followup=$('dFollowup').value; current.owner=$('dOwner').value; current.notes=$('dNotes').value; current.followups=fnumVal||'';
    save(current.timestamp, { status:current.status, category:current.category, value:current.value, followup:current.followup, owner:current.owner, notes:current.notes, followups:current.followups });
    render(); this.textContent='Saved ✓'; var self=this; setTimeout(function(){ self.textContent='Save'; }, 1300);
  });

  // Delete (soft) + undo
  var undoTimer=null;
  function showToast(msg, onUndo){
    $('toastMsg').textContent=msg; $('toast').classList.add('show');
    clearTimeout(undoTimer); undoTimer=setTimeout(function(){ $('toast').classList.remove('show'); }, 6000);
    $('toastUndo').onclick=function(){ clearTimeout(undoTimer); $('toast').classList.remove('show'); onUndo(); };
  }
  $('dDelete').addEventListener('click', function(){
    if(!current) return;
    var e=current, nm=e.name||'Lead';
    e.deleted='TRUE'; save(e.timestamp, { deleted:'TRUE' });
    closeDrawer(); render();
    showToast(nm+' deleted', function(){ e.deleted=''; save(e.timestamp, { deleted:'' }); render(); });
  });

  /* Google occasionally returns an error page instead of the data - usually a
     brief hiccup after a burst of writes. Retry a couple of times before
     giving up, and never leave the page blank without saying why. */
  function load(attempt){
    attempt = attempt || 1;
    $('refresh').textContent = attempt>1 ? ('Retrying '+attempt+'/3…') : 'Loading…';
    fetch(SHEET_ENDPOINT, {method:'GET', cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(function(txt){
        var rows;
        try { rows = JSON.parse(txt); }
        catch(err){ throw new Error('Google returned a page instead of data'); }
        var list = Array.isArray(rows) ? rows : (rows.enquiries||[]);
        data = list.filter(function(e){ return e.timestamp || e.name || e.email; });
        $('banner').style.display='none';
        $('refresh').textContent='Refresh';
        render();
      })
      .catch(function(err){
        if(attempt < 3){
          $('refresh').textContent='Retrying…';
          setTimeout(function(){ load(attempt+1); }, attempt*2500);
          return;
        }
        $('refresh').textContent='Refresh';
        var b=$('banner');
        b.style.display='block';
        b.innerHTML = '<b>Could not load your data.</b> '+esc(err && err.message ? err.message : 'Unknown error')
          + ' &mdash; this is normally temporary. <a href="#" id="bRetry">Try again</a>';
        var r=document.getElementById('bRetry');
        if(r) r.addEventListener('click', function(ev){ ev.preventDefault(); load(1); });
        render();   /* keep the tabs and empty columns on screen rather than a blank page */
      });
  }
  /* Force pull: the CRM's own endpoint also runs the Gmail sync when called
     with ?action=sync, so there is no second URL to configure. Apps Script
     sends no CORS headers, so we fire the request and then poll the sheet
     until the row count changes rather than reading a response. */
  (function(){
    var btn=$('forcePull'); if(!btn) return;
    btn.addEventListener('click', function(){
      btn.disabled=true; btn.textContent='Pulling…';
      var before = data.length;
      try {
        fetch(SHEET_ENDPOINT + (SHEET_ENDPOINT.indexOf('?')>-1?'&':'?') + 'action=sync',
              {method:'GET', mode:'no-cors', cache:'no-store'}).catch(function(){});
      } catch(err){}
      var waited=0, MAX=60;
      function done(msg){
        btn.disabled=false; btn.textContent='Force pull';
        if(msg && typeof showToast==='function') showToast(msg);
      }
      function poll(){
        waited += 5;
        btn.textContent='Pulling… '+waited+'s';
        fetch(SHEET_ENDPOINT, {method:'GET', cache:'no-store'})
          .then(function(r){ return r.text(); })
          .then(function(txt){
            var rows=JSON.parse(txt);
            var list=(Array.isArray(rows)?rows:(rows.enquiries||[]))
              .filter(function(e){ return e.timestamp || e.name || e.email; });
            if(list.length !== before){
              var n = list.length - before;
              data = list;
              $('banner').style.display='none';
              render();
              done(n>0 ? (n+' new '+(n===1?'enquiry':'enquiries')+' pulled in') : 'Up to date');
              return;
            }
            if(waited>=MAX){ load(1); done('Nothing new'); return; }
            setTimeout(poll, 5000);
          })
          .catch(function(){
            if(waited>=MAX){ load(1); done('Could not confirm — try Refresh'); return; }
            setTimeout(poll, 5000);
          });
      }
      setTimeout(poll, 5000);
    });
  })();

  $('refresh').addEventListener('click', function(){ load(1); });
  $('search').addEventListener('input', render);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });

  load(1);
};
// If the gate was already satisfied this session, the unlock ran before this script defined
// __crmStart — so start it now.
if (!document.body.classList.contains('locked')) window.__crmStart();
</script>
